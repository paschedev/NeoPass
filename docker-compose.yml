version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: entrypass-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: entrypass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # Base para los tests e2e del backend (backend/.env.test). Los datos viven en
  # memoria: se pierden al reiniciar el contenedor.
  db-test:
    image: postgres:15-alpine
    container_name: neopass-db-test
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: neopass_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: entrypass-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data:
