name: CI

on:
  pull_request:
    branches: [dev, main]
    # `labeled`: poner la etiqueta automerge después de abrir el PR vuelve a
    # correr la CI y, si pasa, lo mergea.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      # Igual que db-test de docker-compose.yml: los e2e apuntan a localhost:5433.
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: neopass_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U user -d neopass_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"
      - name: Build
        run: npm run build
      - name: Tests unitarios
        run: npm test
      - name: Tests e2e
        run: npm run test:e2e

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: http://localhost:3001
      # Clave de prueba pública de Turnstile (siempre valida).
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  # El repo es privado y el plan gratuito de GitHub no tiene auto-merge nativo:
  # este job mergea a dev (merge commit) los PRs con la etiqueta `automerge`
  # cuando pasan Backend y Frontend. Sin la etiqueta no hace nada.
  automerge:
    name: Auto-merge
    needs: [backend, frontend]
    if: github.base_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Mergear si tiene la etiqueta automerge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Las etiquetas se leen ahora y no del evento, que puede no traerlas si
        # se agregaron al crear el PR. --match-head-commit mergea solo el commit
        # que pasó la CI.
        run: |
          labels=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
          if ! grep -qx automerge <<< "$labels"; then
            echo "El PR no tiene la etiqueta automerge: queda para mergear a mano."
            exit 0
          fi
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$HEAD_SHA"
